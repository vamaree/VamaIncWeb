name: Build Vama Wealth APK

on:
  push:
    branches: [vama-wealth-apk-build]
    paths:
      - 'VamaWealthIntelligence/**'
      - '.github/workflows/vama-wealth-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: VamaWealthIntelligence
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp VamaWealthIntelligence/app/build/outputs/apk/debug/app-debug.apk VamaWealthIntelligence.apk
      - name: Publish APK payload for transfer
        run: |
          base64 -w0 VamaWealthIntelligence.apk > VamaWealthIntelligence.apk.b64
          git config user.name "Vama Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add VamaWealthIntelligence.apk.b64
          git commit -m "Publish Vama Wealth APK payload [skip ci]"
          git push origin HEAD:vama-wealth-apk-build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VamaWealthIntelligence-APK
          path: VamaWealthIntelligence.apk
          if-no-files-found: error
          retention-days: 14
